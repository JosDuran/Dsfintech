stages:
  - build
  - test

# -----------------------------------
# Variables globales
# -----------------------------------
variables:
  POSTGRES_DB: app
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
  DJANGO_SETTINGS_MODULE: core.settings.dev
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  CHROME_BIN: /usr/bin/chromium-browser

# -----------------------------------
# Build de backend
# -----------------------------------
build-backend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest ./Microservicio
    - docker push $CI_REGISTRY_IMAGE/backend:latest

# -----------------------------------
# Build de frontend
# -----------------------------------
build-frontend:
  stage: build
  image: docker:24.0.5
  services:
    - docker:dind
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:latest

# -----------------------------------
# Test backend Django
# -----------------------------------
backend-tests:
  stage: test
  image: $CI_REGISTRY_IMAGE/backend:latest
  services:
    - name: postgres:15
      alias: postgres
  script:
    - python manage.py migrate
    - pytest
  artifacts:
    when: always
    reports:
      junit: junit.xml

# -----------------------------------
# Test frontend Angular
# -----------------------------------
frontend-tests:
  stage: test
  image: $CI_REGISTRY_IMAGE/frontend:latest
  script:
    - apk add --no-cache chromium
    - npm ci
    - npm run test -- --watch=false --browsers=ChromeHeadlessDocker

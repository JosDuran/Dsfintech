stages:
  - debug
  - build
  - test

# -----------------------------------
# Variables globales
# -----------------------------------
variables:
  POSTGRES_DB: app
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
  DJANGO_SETTINGS_MODULE: core.settings.dev
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# -----------------------------------
# Debug (para verificar runner)
# -----------------------------------
debug:
  stage: debug
  script:
    - whoami
    - which docker
    - docker version
    - pwd

# -----------------------------------
# Build backend
# -----------------------------------
build-backend:
  stage: build
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/backend:latest ./Microservicio
    - docker push $CI_REGISTRY_IMAGE/backend:latest

# -----------------------------------
# Build frontend
# -----------------------------------
build-frontend:
  stage: build
  script:
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
    - docker build -t $CI_REGISTRY_IMAGE/frontend:latest ./frontend
    - docker push $CI_REGISTRY_IMAGE/frontend:latest

# -----------------------------------
# Test backend Django
# -----------------------------------
backend-tests:
  stage: test
  script:
    - docker run --rm \
        --network host \
        -e POSTGRES_DB=$POSTGRES_DB \
        -e POSTGRES_USER=$POSTGRES_USER \
        -e POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
        -e DATABASE_URL=$DATABASE_URL \
        $CI_REGISTRY_IMAGE/backend:latest \
        sh -c "python manage.py migrate && pytest"

# -----------------------------------
# Test frontend Angular
# -----------------------------------
frontend-tests:
  stage: test
  script:
    - docker run --rm $CI_REGISTRY_IMAGE/frontend:latest sh -c "
        npm ci &&
        npm run test -- --watch=false --browsers=ChromeHeadless
      "

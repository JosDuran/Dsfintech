<!-- person-form.component.html -->

<h2 class="mb-3">
  {{ personId ? 'Editar persona' : 'Nueva persona' }}
</h2>

<form [formGroup]="form" (ngSubmit)="submit()" novalidate>

  <!-- ERROR GENERAL -->
  <div *ngIf="error" class="alert alert-danger">
    {{ error }}
  </div>

  <!-- LOADING (solo al cargar edición) -->
  <div *ngIf="loading && personId" class="text-center my-4">
    <div class="spinner-border" role="status"></div>
    <p class="mt-2">Cargando persona...</p>
  </div>

  <div *ngIf="!loading || !personId">

    <!-- NOMBRE -->
    <div class="mb-3">
      <label class="form-label">Nombre</label>
      <input
        type="text"
        class="form-control"
        formControlName="first_name"
        [class.is-invalid]="form.get('first_name')?.invalid && form.get('first_name')?.touched"
      >
      <div class="invalid-feedback">
        <span *ngIf="form.get('first_name')?.errors?.['required']">
          El nombre es obligatorio
        </span>
        <span *ngIf="form.get('first_name')?.errors?.['maxlength']">
          Máximo 100 caracteres
        </span>
      </div>
    </div>

    <!-- APELLIDO -->
    <div class="mb-3">
      <label class="form-label">Apellido</label>
      <input
        type="text"
        class="form-control"
        formControlName="last_name"
        [class.is-invalid]="form.get('last_name')?.invalid && form.get('last_name')?.touched"
      >
      <div class="invalid-feedback">
        <span *ngIf="form.get('last_name')?.errors?.['required']">
          El apellido es obligatorio
        </span>
        <span *ngIf="form.get('last_name')?.errors?.['maxlength']">
          Máximo 100 caracteres
        </span>
      </div>
    </div>

    <!-- EMAIL -->
    <div class="mb-3">
      <label class="form-label">Email</label>
      <input
        type="email"
        class="form-control"
        formControlName="email"
        [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
      >
      <div class="invalid-feedback">
        <span *ngIf="form.get('email')?.errors?.['required']">
          El email es obligatorio
        </span>
        <span *ngIf="form.get('email')?.errors?.['email']">
          El email no tiene un formato válido
        </span>
      </div>
    </div>

    <!-- BOTONES -->
    <div class="d-flex gap-2">
      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="form.invalid || loading"
      >
        <span *ngIf="!loading">Guardar</span>
        <span *ngIf="loading">Guardando...</span>
      </button>

      <a routerLink="/persons" class="btn btn-secondary">
        Cancelar
      </a>
    </div>

  </div>
</form>

<!-- person-list.component.html -->

<h2 class="mb-3">Listado de personas</h2>

<!-- Botón crear -->
<div class="mb-3">
  <a routerLink="/persons/new" class="btn btn-success">
    + Nueva persona
  </a>
</div>

<table class="table table-striped" *ngIf="persons.length > 0; else noData">
  <thead class="table-dark">
    <tr>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>Email</th>
      <th>Creado</th>
      <th style="width: 160px">Acciones</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let p of persons">
      <td>{{ p.first_name }}</td>
      <td>{{ p.last_name }}</td>
      <td>{{ p.email }}</td>
      <td>{{ p.created_at | date:'short' }}</td>
      <td>
        <a
          class="btn btn-sm btn-warning me-2"
          [routerLink]="['/persons', p.id, 'edit']"
        >
          Editar
        </a>

        <button
          class="btn btn-sm btn-danger"
          (click)="delete(p.id)"
        >
          Eliminar
        </button>
      </td>
    </tr>
  </tbody>
</table>

<ng-template #noData>
  <p class="text-center text-muted">No hay personas registradas</p>
</ng-template>

<!-- Paginación visual -->
<nav *ngIf="persons.length > 0" aria-label="Page navigation example" class="mt-3">
  <ul class="pagination justify-content-center">
    <li class="page-item" [class.disabled]="page === 1">
      <button class="page-link" (click)="prevPage()">Prev</button>
    </li>

    <li class="page-item disabled">
      <span class="page-link">{{ page }}</span>
    </li>

    <li class="page-item">
      <button class="page-link" (click)="nextPage()">Next</button>
    </li>
  </ul>
</nav>

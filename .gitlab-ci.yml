# .gitlab-ci.yml
stages:
  - debug
  - build
  - test

# -----------------------------------
# Variables globales
# -----------------------------------
variables:
  POSTGRES_DB: app
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres
  DATABASE_URL: postgres://postgres:postgres@postgres:5432/app
  DJANGO_SETTINGS_MODULE: core.settings.dev
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# -----------------------------------
# Debug (entorno del runner)
# -----------------------------------
debug:
  stage: debug
  image: alpine:3.19
  script:
    - whoami
    - pwd
    - env | sort

# -----------------------------------
# Build backend (USA Docker)
# -----------------------------------
build-backend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/backend:latest" ./Microservicio
    - docker push "$CI_REGISTRY_IMAGE/backend:latest"

# -----------------------------------
# Build frontend (USA Docker)
# -----------------------------------
build-frontend:
  stage: build
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_TLS_CERTDIR: ""
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE/frontend:latest" ./frontend
    - docker push "$CI_REGISTRY_IMAGE/frontend:latest"

# -----------------------------------
# Test frontend Angular
# -----------------------------------
frontend-tests:
  stage: test
  image: "$CI_REGISTRY_IMAGE/frontest:latest"
  script:
    - npm ci
    - npm run test -- --watch=false --browsers=ChromeHeadless

# -----------------------------------
# Test backend Django (SIN Docker-in-Docker)
# -----------------------------------
backend-tests:
  stage: test
  image: "$CI_REGISTRY_IMAGE/backend:latest"
  services:
    - name: postgres:15
      alias: postgres
  before_script:
    - cd Microservicio  # <-- AQUÍ EL CAMBIO      
  script:
    - python manage.py migrate
    - pytest

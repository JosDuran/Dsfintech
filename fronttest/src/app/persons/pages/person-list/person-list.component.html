<h2 class="mb-3">Listado de personas</h2>

<!-- Botón crear -->
<div class="mb-3">
  <a routerLink="/persons/new" class="btn btn-success">
    + Nueva persona
  </a>
</div>

<!-- ERROR -->
<div *ngIf="error" class="alert alert-danger">
  {{ error }}
</div>

<!-- LOADING -->
<div *ngIf="loading" class="text-center my-4">
  <div class="spinner-border" role="status"></div>
  <p class="mt-2">Cargando personas...</p>
</div>

<!-- FILTRO -->
<div class="row mb-3">
  <div class="col-md-6">
    <input
      type="text"
      class="form-control"
      placeholder="Buscar por email o apellido"
      [(ngModel)]="filters.search"
      (ngModelChange)="applyFilters()"
    />
  </div>
</div>

<!-- TABLA -->
<table
  class="table table-striped"
  *ngIf="!loading && persons.length > 0"
>
  <thead class="table-dark">
    <tr>
      <th>Nombre</th>
      <th>Apellido</th>
      <th>Email</th>
      <th>Creado</th>
      <th style="width: 160px">Acciones</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let p of persons">
      <td>{{ p.first_name }}</td>
      <td>{{ p.last_name }}</td>
      <td>{{ p.email }}</td>
      <td>{{ p.created_at | date:'short' }}</td>
      <td>
        <a
          class="btn btn-sm btn-warning me-2"
          [routerLink]="['/persons', p.id, 'edit']"
        >
          Editar
        </a>

        <button
          class="btn btn-sm btn-danger"
          (click)="delete(p.id)"
        >
          Eliminar
        </button>
      </td>
    </tr>
  </tbody>
</table>

<!-- EMPTY STATE -->
<div
  *ngIf="!loading && persons.length === 0"
  class="alert alert-info text-center"
>
  No hay personas registradas
</div>

<!-- PAGINACIÓN -->
<nav *ngIf="!loading && persons.length > 0" class="mt-3">
  <ul class="pagination justify-content-center">
    <li class="page-item" [class.disabled]="page === 1">
      <button class="page-link" (click)="prevPage()">Prev</button>
    </li>

    <li class="page-item disabled">
      <span class="page-link">{{ page }}</span>
    </li>

    <li class="page-item">
      <button class="page-link" (click)="nextPage()">Next</button>
    </li>
  </ul>
</nav>
